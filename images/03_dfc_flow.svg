<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1340" height="420" fill="#ffffff"/>
  <text x="670" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Hailo Dataflow Compiler: three stages (compile_hailo.py --step …)</text>

  <!-- files -->
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="150" width="130" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="85" y="180" font-weight="700">resnet18.onnx</text>
    <text x="85" y="200" font-size="11">float32 · NCHW</text>

    <rect x="405" y="150" width="130" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="470" y="180" font-weight="700">resnet18.har</text>
    <text x="470" y="200" font-size="11">float32 · NHWC</text>

    <rect x="790" y="150" width="140" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="860" y="176" font-weight="700">resnet18_</text>
    <text x="860" y="193" font-weight="700">quantized.har</text>
    <text x="860" y="210" font-size="11">int8 weights + acts</text>

    <rect x="1190" y="150" width="130" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="1255" y="180" font-weight="700">resnet18.hef</text>
    <text x="1255" y="200" font-size="11">17.7 MB · HAILO8L</text>
  </g>

  <!-- stages -->
  <g font-size="13" fill="#0f172a">
    <rect x="180" y="70" width="195" height="230" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="277" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">1 · parse</text>
    <text x="196" y="128">translate_onnx_model()</text>
    <text x="196" y="156">• ONNX ops → Hailo layers</text>
    <text x="196" y="180">• fold BatchNorm into Conv</text>
    <text x="196" y="204">• fuse ReLU</text>
    <text x="196" y="228">• NCHW → NHWC</text>
    <text x="277" y="285" text-anchor="middle" font-size="12" fill="#475569">~2 s</text>

    <rect x="565" y="70" width="195" height="230" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="662" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">2 · optimize</text>
    <text x="581" y="128">load_model_script()</text>
    <text x="581" y="148">optimize(calib)</text>
    <text x="581" y="176">• add normalization layer</text>
    <text x="581" y="200">• collect statistics</text>
    <text x="581" y="224">• int8 quantization</text>
    <text x="581" y="248">• bias correction</text>
    <text x="662" y="285" text-anchor="middle" font-size="12" fill="#475569">~3 min (CPU)</text>

    <rect x="960" y="70" width="200" height="230" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
    <text x="1060" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#a21caf">3 · compile</text>
    <text x="976" y="128">compile()</text>
    <text x="976" y="156">• allocate layers to</text>
    <text x="976" y="176">  chip clusters</text>
    <text x="976" y="200">• fits in single context</text>
    <text x="976" y="224">• build HEF binary</text>
    <text x="1060" y="285" text-anchor="middle" font-size="12" fill="#475569">~6 min (CPU)</text>
  </g>

  <g stroke="#475569" stroke-width="2">
    <line x1="150" y1="185" x2="178" y2="185" marker-end="url(#a)"/>
    <line x1="375" y1="185" x2="403" y2="185" marker-end="url(#a)"/>
    <line x1="535" y1="185" x2="563" y2="185" marker-end="url(#a)"/>
    <line x1="760" y1="185" x2="788" y2="185" marker-end="url(#a)"/>
    <line x1="930" y1="185" x2="958" y2="185" marker-end="url(#a)"/>
    <line x1="1160" y1="185" x2="1188" y2="185" marker-end="url(#a)"/>
  </g>

  <!-- calib input -->
  <rect x="582" y="330" width="160" height="70" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="662" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">calib_set.npy</text>
  <text x="662" y="378" text-anchor="middle" font-size="11" fill="#0f172a">uint8 RGB · NHWC</text>
  <line x1="662" y1="330" x2="662" y2="302" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
