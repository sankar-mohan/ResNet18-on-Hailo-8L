<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="400" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">What the optimize stage does (optimization_level=1)</text>

  <g font-size="13" fill="#0f172a">
    <rect x="20" y="70" width="190" height="130" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="115" y="98" text-anchor="middle" font-size="15" font-weight="700">Calibration data</text>
    <text x="35" y="126">512 images available</text>
    <text x="35" y="148">64 used (default</text>
    <text x="35" y="168">calibset_size)</text>
    <text x="35" y="190" font-size="12" fill="#475569">raw 0-255 RGB</text>

    <rect x="250" y="70" width="190" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="345" y="98" text-anchor="middle" font-size="15" font-weight="700">On-chip normalize</text>
    <text x="265" y="126">(x − mean) / std</text>
    <text x="265" y="150" font-size="12">mean = [123.675, 116.28,</text>
    <text x="265" y="168" font-size="12">        103.53]</text>
    <text x="265" y="188" font-size="12">std  = [58.395, 57.12, 57.375]</text>

    <rect x="480" y="70" width="190" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="575" y="98" text-anchor="middle" font-size="15" font-weight="700">Statistics</text>
    <text x="495" y="126">Run float model on</text>
    <text x="495" y="148">calibration images;</text>
    <text x="495" y="170">record min/max range</text>
    <text x="495" y="192">of every layer</text>

    <rect x="710" y="70" width="170" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="795" y="98" text-anchor="middle" font-size="15" font-weight="700">Quantize</text>
    <text x="725" y="126">float32 → int8</text>
    <text x="725" y="148">scale + zero-point</text>
    <text x="725" y="170">per layer</text>

    <rect x="920" y="70" width="160" height="130" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1000" y="98" text-anchor="middle" font-size="15" font-weight="700">Bias correction</text>
    <text x="935" y="126">Fix the mean shift</text>
    <text x="935" y="148">rounding causes,</text>
    <text x="935" y="170">block by block</text>
    <text x="935" y="192" font-size="12" fill="#475569">22 blocks · ~2 min</text>
  </g>
  <line x1="210" y1="135" x2="248" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="135" x2="478" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="670" y1="135" x2="708" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="880" y1="135" x2="918" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- results -->
  <rect x="20" y="240" width="1060" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="550" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Result on 500 held-out Imagenette images (DFC simulator)</text>
  <g font-size="14" fill="#0f172a">
    <text x="60" y="305">Float (SDK_FP_OPTIMIZED)</text>
    <rect x="290" y="290" width="600" height="22" rx="4" fill="#e2e8f0"/>
    <rect x="290" y="290" width="477.6" height="22" rx="4" fill="#3b82f6"/>
    <text x="910" y="306" font-weight="700">0.796</text>

    <text x="60" y="345">Int8 (SDK_QUANTIZED)</text>
    <rect x="290" y="330" width="600" height="22" rx="4" fill="#e2e8f0"/>
    <rect x="290" y="330" width="476.4" height="22" rx="4" fill="#22c55e"/>
    <text x="910" y="346" font-weight="700">0.794</text>
  </g>
  <text x="975" y="326" font-size="13" fill="#15803d" font-weight="700">−0.2 %</text>
  <text x="975" y="346" font-size="12" fill="#475569">SNR 22.9 dB</text>
</svg>
