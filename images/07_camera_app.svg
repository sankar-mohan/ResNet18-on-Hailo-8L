<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Live camera app: camera_classify.py</text>

  <!-- setup (once) -->
  <rect x="20" y="60" width="1160" height="80" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="40" y="88" font-size="15" font-weight="700" fill="#a21caf">Once, at start-up</text>
  <g font-size="13" fill="#0f172a">
    <text x="40" y="116">open camera (--camera picam | usb)  →  HEF(resnet18.hef)  →  VDevice()  →  configure()  →  InferVStreams + activate()  →  cv2.namedWindow</text>
  </g>
  <line x1="600" y1="140" x2="600" y2="168" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- loop frame -->
  <rect x="20" y="170" width="1160" height="350" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="40" y="198" font-size="15" font-weight="700" fill="#334155">Every frame (loop until q / Esc / window closed)</text>

  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="45" y="220" width="160" height="95" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="125" y="248" font-weight="700">camera.read()</text>
    <text x="125" y="270" font-size="12">640×480 BGR</text>
    <text x="125" y="290" font-size="12">Picamera2 / VideoCapture</text>

    <rect x="235" y="220" width="170" height="95" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="248" font-weight="700">centre_crop_box()</text>
    <text x="320" y="270" font-size="12">square = 224/256 of</text>
    <text x="320" y="290" font-size="12">short side (420×420)</text>

    <rect x="435" y="220" width="170" height="95" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="520" y="248" font-weight="700">preprocess()</text>
    <text x="520" y="270" font-size="12">resize 224 · BGR→RGB</text>
    <text x="520" y="290" font-size="12">uint8 · writeable copy</text>

    <rect x="635" y="220" width="170" height="95" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="720" y="248" font-weight="700">Hailo-8L</text>
    <text x="720" y="270" font-size="12">pipeline.infer()</text>
    <text x="720" y="290" font-size="12">≈3 ms → 1000 floats</text>

    <rect x="835" y="220" width="170" height="95" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="920" y="248" font-weight="700">softmax · top-k</text>
    <text x="920" y="270" font-size="12">keep prob ≥ --threshold</text>
    <text x="920" y="290" font-size="12">look up label names</text>

    <rect x="835" y="360" width="170" height="95" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="920" y="388" font-weight="700">draw_overlay()</text>
    <text x="920" y="410" font-size="12">orange crop box · labels</text>
    <text x="920" y="430" font-size="12">FPS · Hailo ms</text>

    <rect x="635" y="360" width="170" height="95" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="720" y="388" font-weight="700">cv2.imshow()</text>
    <text x="720" y="410" font-size="12">window on VNC /</text>
    <text x="720" y="430" font-size="12">Pi desktop</text>

    <rect x="435" y="360" width="170" height="95" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <text x="520" y="388" font-weight="700">cv2.waitKey(1)</text>
    <text x="520" y="410" font-size="12">q / Esc / closed window</text>
    <text x="520" y="430" font-size="12">→ exit loop</text>

    <rect x="1035" y="360" width="125" height="95" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="1097" y="392" font-weight="700">Exit</text>
    <text x="1097" y="414" font-size="12">camera.close()</text>
    <text x="1097" y="434" font-size="12">release chip</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="205" y1="267" x2="233" y2="267" marker-end="url(#a)"/>
    <line x1="405" y1="267" x2="433" y2="267" marker-end="url(#a)"/>
    <line x1="605" y1="267" x2="633" y2="267" marker-end="url(#a)"/>
    <line x1="805" y1="267" x2="833" y2="267" marker-end="url(#a)"/>
    <line x1="920" y1="315" x2="920" y2="358" marker-end="url(#a)"/>
    <line x1="835" y1="407" x2="807" y2="407" marker-end="url(#a)"/>
    <line x1="635" y1="407" x2="607" y2="407" marker-end="url(#a)"/>
    <path d="M435,407 L125,407 L125,317" fill="none" marker-end="url(#a)"/>
  </g>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#475569">next frame</text>
  <path d="M520,455 L520,500 L1097,500 L1097,457" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="810" y="494" text-anchor="middle" font-size="12" fill="#a16207">quit</text>
</svg>
